# Every check on macOS and Windows, for every pull request (and on demand), so a change for one platform
# can't break the other: typecheck and unit tests (npm run check), then the smoke test.
#
# The smoke test builds the app, launches the real Electron window with a throwaway profile and drives the UI
# step by step (see docs/development.md#tests). A runner's home folder has no ~/.claude, so it runs in the made-up
# home the README screenshots use (npm run smoke:demo): a few git projects with sessions, one of them running. It
# has no login, so nothing is sent, and the live steps (SWITCHBOARD_SMOKE_LIVE_CWD) never run here. Its
# screenshots and result.json from apps/desktop/.smoke are uploaded as an artifact, also when it fails.
name: Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # The engine's tests make real git repositories and commits.
      - name: Git identity for the tests
        run: |
          git config --global user.name "Switchboard CI"
          git config --global user.email "ci@switchboard.invalid"

      - name: Typecheck and unit tests
        run: npm run check

      # Switchboard drives the user's own claude binary; installing it lets the steps that read its version and
      # command list see a real one. It is never logged in, so nothing is sent.
      - name: Install Claude Code
        if: ${{ !cancelled() }}
        run: npm install --global @anthropic-ai/claude-code

      # Also after failed unit tests, so one run shows both.
      - name: Smoke test
        if: ${{ !cancelled() }}
        run: npm run smoke:demo

      - name: Upload screenshots and results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ matrix.os }}
          path: apps/desktop/.smoke
          if-no-files-found: ignore
          # .smoke starts with a dot, which upload-artifact leaves out unless told.
          include-hidden-files: true
          retention-days: 7
