# Builds the website (website/, Astro + Starlight) and publishes it to GitHub Pages at
# https://switchboard.struyfconsulting.com/, with the remote app (apps/remote) at /remote/. Pull requests that touch the site, the UI (the shortcuts page is
# built from its registry) or the changelog only build it, so a broken link or a missing screenshot fails there.
# It doesn't run when a release is published: that run is on the tag, which the github-pages environment doesn't allow
# to deploy (only main), and the Release commit's push to main has already deployed the new changelog.
name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "apps/remote/**"
      - "packages/protocol/src/remote*.ts"
      - "apps/ui/src/lib/shortcuts.ts"
      - "CHANGELOG.md"
      - "docs/videos/**"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "website/**"
      - "apps/remote/**"
      - "packages/protocol/src/remote*.ts"
      - "apps/ui/**"
      - "CHANGELOG.md"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push replaces a deploy that hasn't started.
concurrency:
  group: website-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Only the website's dependencies and the remote app's (built into the site at /remote/): none of Electron's.
      - name: Install
        run: npm ci --workspace @switchboard/website --workspace @switchboard/remote --workspace @switchboard/protocol --include-workspace-root
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      # Fails on a broken internal link (starlight-links-validator) or a missing screenshot.
      - name: Build
        run: npm run website:build

      - name: Upload
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
