# Runs the smoke test (npm run smoke) on every pull request, on macOS and Windows.
#
# The smoke test builds the app, launches the real Electron window with a throwaway profile and drives
# the UI step by step (see docs/development.md#tests). On a runner the home folder is empty: there is
# no ~/.claude, no sessions and no login, so this checks the app starts, talks to the engine and that
# every view degrades quietly without data. The live steps (SWITCHBOARD_SMOKE_LIVE_CWD) never run here.
#
# Screenshots and result.json from apps/desktop/.smoke are uploaded as an artifact, also when it fails.
name: Smoke test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # Switchboard drives the user's own claude binary; installing it lets the steps that read its
      # version and command list see a real one. It is never logged in, so nothing is sent.
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code

      - name: Smoke test
        run: npm run smoke

      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.os }}
          path: apps/desktop/.smoke
          if-no-files-found: ignore
          retention-days: 7
