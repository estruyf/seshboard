# Builds Switchboard for a GitHub release.
#
# Runs when a release is published on GitHub (for a tag like v0.2.0), with two builds side by side:
# - mac: builds the app on an Apple Silicon runner, signs and notarises it, and attaches the .dmg to
#   that release, with the .zip and the update feed the in-app updater reads (latest-mac.yml);
# - windows: builds one installer for x64 and arm64, signs it with Azure Trusted Signing, and attaches
#   it with its update feed (latest.yml).
# The version comes from the tag. When the release has no notes, the matching CHANGELOG.md section is used.
#
# Channels: a release is the Stable feed (latest-mac.yml, latest.yml). A pre-release tagged
# vX.Y.Z-nightly.YYYYMMDD.N is the Nightly feed (nightly-mac.yml, nightly.yml). Any other pre-release
# gets the installers but no feed, so no one is ever updated to it.
#
# A Stable release also updates the Homebrew cask in estruyf/homebrew-tap (docs/homebrew.md).
#
# Nothing is ever attached unsigned: without the signing secrets the run fails.
# See docs/building-and-signing.md for the secrets.
#
# Releases tagged vscode-vX.Y.Z are the VS Code companion's (release-vscode.yml); this workflow skips them.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Version and update channel
    if: ${{ !startsWith(github.event.release.tag_name, 'vscode-') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      feed: ${{ steps.channel.outputs.feed }}
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Version from the tag
        id: version
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::The release tag '$TAG' is not a version like v1.2.3."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Update channel
        id: channel
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          # feed: which update feed this release carries (latest, nightly, or none).
          if [[ "$VERSION" == *-nightly.* ]]; then
            if [ "$PRERELEASE" != "true" ]; then
              echo "::error::$TAG is a nightly version; publish it as a pre-release."
              exit 1
            fi
            echo "feed=nightly" >> "$GITHUB_OUTPUT"
          elif [ "$PRERELEASE" == "true" ]; then
            echo "::notice::$TAG is a pre-release but not a nightly: it gets no update feed."
            echo "feed=none" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" == *-* ]]; then
            echo "::error::$TAG has a pre-release version but is published as a release; Stable users would be offered it."
            exit 1
          else
            echo "feed=latest" >> "$GITHUB_OUTPUT"
          fi

  mac:
    name: Build, sign, notarise and attach the .dmg
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.release.tag_name }}
      VERSION: ${{ needs.prepare.outputs.version }}
      FEED: ${{ needs.prepare.outputs.feed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck and unit tests
        run: npm run check

      - name: Build, sign and notarise
        env:
          # Developer ID Application certificate and its private key, exported as .p12 and base64-encoded.
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          # Notarisation with an app-specific password (electron-builder notarises when these are set).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK" ] || [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::Signing secrets are missing, and nothing is attached unsigned. See docs/building-and-signing.md."
            exit 1
          fi
          # The app's version (About panel, .dmg name) is the release's.
          npm pkg set version="$VERSION" -w @switchboard/desktop
          if [ "$FEED" == "nightly" ]; then
            # electron-builder names a GitHub feed latest-mac.yml unless told the channel.
            npm run dist -w @switchboard/desktop -- -c.publish.channel=nightly
          else
            npm run dist
          fi

      - name: Check the signature and notarisation
        run: |
          app=apps/desktop/dist/mac-arm64/Switchboard.app
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl -a -vv "$app" 2>&1 | tee spctl.txt
          grep -q "source=Notarized Developer ID" spctl.txt

      - name: Check the update feed
        run: |
          cd apps/desktop/dist
          ls -la
          feeds=$(ls *-mac.yml 2>/dev/null || true)
          expected="$FEED-mac.yml"
          # Only one architecture is built today. When an Intel build is added, merge its files into the
          # same latest-mac.yml (one `files` entry per arch) instead of uploading a second feed over it.
          if [ "$FEED" != "none" ] && [ "$feeds" != "$expected" ]; then
            echo "::error::Expected exactly $expected, found: ${feeds:-nothing}."
            exit 1
          fi
          if [ "$FEED" != "none" ]; then
            grep -q "^version: $VERSION\$" "$expected" || { echo "::error::$expected is not for $VERSION."; cat "$expected"; exit 1; }
            ls Switchboard-*-mac.zip >/dev/null
          fi

      - name: Attach the .dmg, .zip and update feed to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd apps/desktop/dist
          files=(*.dmg *.zip *.zip.blockmap)
          # The feed goes up last, so it never points at a .zip that isn't there yet.
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          if [ "$FEED" != "none" ]; then
            gh release upload "$TAG" "$FEED-mac.yml" --clobber --repo "$GITHUB_REPOSITORY"
          fi

      - name: Guard against a feed on the wrong release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # latest*.yml is the Stable feed: it must only ever be on a published, non-pre-release release.
          read -r draft prerelease < <(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"')
          assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          if { [ "$draft" == "true" ] || [ "$prerelease" == "true" ]; } && grep -q '^latest.*\.yml$' <<< "$assets"; then
            echo "::error::$TAG is a draft or pre-release but carries a latest*.yml update feed. Delete that asset."
            exit 1
          fi

      - name: Fill in empty release notes from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ github.event.release.body }}
        run: |
          if [ -n "$(echo "$BODY" | tr -d '[:space:]')" ]; then
            echo "The release has notes; leaving them."
            exit 0
          fi
          # This version's CHANGELOG section, without the link definitions.
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on && !/^\[[^]]+\]: / { print }
          ' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            gh release edit "$TAG" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          else
            echo "::warning::CHANGELOG.md has no section for $VERSION; the release notes stay empty."
          fi

      # What makes `brew install --cask estruyf/tap/switchboard` resolve. Only the Stable feed belongs in
      # the tap: a cask carries one version, and a pre-release would reach everyone running
      # `brew upgrade --greedy` while releases/latest still points elsewhere. Last, so a tap failure
      # never leaves a release without its notes.
      - name: Update the Homebrew tap
        if: env.FEED == 'latest'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set, so the tap still serves the previous version. Run homebrew/publish-cask.sh --push by hand (docs/homebrew.md)."
            exit 0
          fi
          ./homebrew/publish-cask.sh --push

  windows:
    name: Build, sign and attach the Windows installer
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60
    # A fixed subject for the Azure federated credential (repo:estruyf/switchboard:environment:windows-signing),
    # which can't match every release tag.
    environment: windows-signing
    permissions:
      contents: write
      # Azure login with OpenID Connect: no client secret is stored in the repository.
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name }}
      VERSION: ${{ needs.prepare.outputs.version }}
      FEED: ${{ needs.prepare.outputs.feed }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check the signing settings
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TRUSTED_SIGNING_ENDPOINT: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT_NAME: ${{ vars.TRUSTED_SIGNING_ACCOUNT_NAME }}
          CERTIFICATE_PROFILE_NAME: ${{ vars.CERTIFICATE_PROFILE_NAME }}
        run: |
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID TRUSTED_SIGNING_ENDPOINT TRUSTED_SIGNING_ACCOUNT_NAME CERTIFICATE_PROFILE_NAME; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set, and nothing is attached unsigned. See docs/building-and-signing.md."
              exit 1
            fi
          done

      - name: Install
        run: npm ci

      # Trusted Signing's PowerShell module (which electron-builder calls for every .exe) picks up this
      # Azure CLI login.
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and sign
        env:
          TRUSTED_SIGNING_ENDPOINT: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT_NAME: ${{ vars.TRUSTED_SIGNING_ACCOUNT_NAME }}
          CERTIFICATE_PROFILE_NAME: ${{ vars.CERTIFICATE_PROFILE_NAME }}
        run: |
          npm pkg set version="$VERSION" -w @switchboard/desktop
          # electron-builder signs the app, its helpers, the installer and the uninstaller as it builds
          # them, so the update feed's checksums are of the signed files.
          args=(
            -c.win.azureSignOptions.endpoint="$TRUSTED_SIGNING_ENDPOINT"
            -c.win.azureSignOptions.codeSigningAccountName="$TRUSTED_SIGNING_ACCOUNT_NAME"
            -c.win.azureSignOptions.certificateProfileName="$CERTIFICATE_PROFILE_NAME"
          )
          if [ "$FEED" == "nightly" ]; then
            args+=(-c.publish.channel=nightly)
          fi
          npm run dist:win -w @switchboard/desktop -- "${args[@]}"

      - name: Check the signatures
        shell: pwsh
        run: |
          $files = @(Get-ChildItem apps/desktop/dist/*.exe) + @(Get-ChildItem apps/desktop/dist/win-*unpacked/Switchboard.exe)
          if ($files.Count -lt 3) { Write-Error "Expected the installer and an app per architecture, found: $($files.Name -join ', ')"; exit 1 }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName
            Write-Host "$($file.FullName): $($signature.Status) ($($signature.SignerCertificate.Subject))"
            if ($signature.Status -ne 'Valid') { Write-Error "$($file.Name) is not signed: $($signature.StatusMessage)"; exit 1 }
          }

      - name: Check the update feed
        run: |
          cd apps/desktop/dist
          ls -la
          feeds=$(ls latest.yml nightly.yml 2>/dev/null || true)
          expected="$FEED.yml"
          if [ "$FEED" != "none" ] && [ "$feeds" != "$expected" ]; then
            echo "::error::Expected exactly $expected, found: ${feeds:-nothing}."
            exit 1
          fi
          if [ "$FEED" != "none" ]; then
            grep -q "^version: $VERSION\$" "$expected" || { echo "::error::$expected is not for $VERSION."; cat "$expected"; exit 1; }
          fi

      - name: Attach the installer and update feed to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd apps/desktop/dist
          files=(Switchboard-*-setup.exe Switchboard-*-setup.exe.blockmap)
          # The feed goes up last, so it never points at an installer that isn't there yet.
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          if [ "$FEED" != "none" ]; then
            gh release upload "$TAG" "$FEED.yml" --clobber --repo "$GITHUB_REPOSITORY"
          fi

      - name: Guard against a feed on the wrong release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r draft prerelease < <(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"')
          assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          if { [ "$draft" == "true" ] || [ "$prerelease" == "true" ]; } && grep -q '^latest.*\.yml$' <<< "$assets"; then
            echo "::error::$TAG is a draft or pre-release but carries a latest*.yml update feed. Delete that asset."
            exit 1
          fi
