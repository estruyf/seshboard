<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../shared/base.css">
<style>
  /* The mockup's own styles. Position everything inside .stage (600×540). */
  .sb { right: 0; top: 140px; }
</style>
</head>
<body>
  <div class="dots"></div>

  <div class="copy">
    <div class="brand">
      <img src="../../apps/desktop/build/icon.png" alt="">
      <span class="name">Seshboard</span>
    </div>
    <div class="eyebrow"><span class="dot"></span>New in Seshboard</div>
    <h1>A short headline about <span class="hl">the feature</span></h1>
    <p class="sub">One or two sentences on what it does for you, with the <b>key words</b> in bold.</p>
  </div>

  <div class="cta">
    <span class="btn">Download Seshboard</span>
    <span class="where">github.com/estruyf/switchboard</span>
  </div>

  <div class="stage">
    <div class="sb">
      <div class="head">
        <img src="../../apps/desktop/build/icon.png" alt="">
        <span class="title">Add dark mode toggle to settings</span>
        <span class="meta">acme-store</span>
      </div>
      <div class="chips mono">
        <span class="chip new">theme.ts#L14-18</span>
      </div>
      <div class="msg">Message to Claude<span class="caret"></span></div>
      <div class="foot">
        <span>Opus · High</span>
        <span class="send">Send <span class="kbd">⌘↵</span></span>
      </div>
    </div>
  </div>
</body>
</html>
