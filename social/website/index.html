<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../shared/base.css">
<style>
  /* The website's Open Graph image: the main window, cropped, as the mockup. */
  .window {
    position: absolute; left: 0; top: 34px; width: 720px; height: 470px;
    border-radius: 12px; overflow: hidden;
    box-shadow: 0 0 0 1px var(--edge), 0 28px 60px -14px rgba(0,0,0,0.8);
  }
  .window img { display: block; width: 1100px; height: auto; }
  .stage { overflow: visible; }
</style>
</head>
<body>
  <div class="dots"></div>

  <div class="copy">
    <div class="brand">
      <img src="../../apps/desktop/build/icon.png" alt="">
      <span class="name">Seshboard</span>
    </div>
    <div class="eyebrow"><span class="dot"></span>For Mac and Windows</div>
    <h1>All your <span class="hl">Claude Code</span> sessions in one window</h1>
    <p class="sub">Start sessions, see which ones <b>need you</b> or are <b>working</b>, and pick up any conversation where you left off.</p>
  </div>

  <div class="cta">
    <span class="btn">Read the docs</span>
    <span class="where">seshboard.app</span>
  </div>

  <div class="stage">
    <div class="window"><img src="../../website/src/assets/screenshots/home-dark.png" alt=""></div>
  </div>
</body>
</html>
