<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- GitHub's social preview: 1280×640, upload under Settings → General → Social preview. -->
<meta name="size" content="1280x640">
<link rel="stylesheet" href="../shared/base.css">
<style>
  html, body { width: 1280px; height: 640px; }
  .copy { top: 72px; width: 520px; }
  h1 { font-size: 46px; }
  .facts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 26px; }
  .facts .pill { height: 28px; padding: 0 12px; font-size: 13px; color: var(--text); background: rgba(255,255,255,0.05); box-shadow: inset 0 0 0 1px var(--edge); }
  .facts .pill i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .cta { bottom: 64px; }
  .brew { height: 40px; padding: 0 16px; border-radius: 9px; display: inline-flex; align-items: center; gap: 10px; font-size: 14px; color: var(--text); background: rgba(255,255,255,0.05); box-shadow: inset 0 0 0 1px var(--edge); }
  .brew span { color: var(--faint); }

  /* The real session screenshot (demo data), cropped to its window and running off the right edge. */
  .shot {
    position: absolute; left: 620px; top: 64px; width: 880px; height: 550px;
    border-radius: 12px; overflow: hidden;
    box-shadow: 0 0 0 1px var(--edge), 0 30px 70px -10px rgba(0,0,0,0.8);
  }
  .shot img { position: absolute; left: -44px; top: -44px; width: 968px; }
</style>
</head>
<body>
  <div class="dots"></div>

  <div class="copy">
    <div class="brand">
      <img src="../../apps/desktop/build/icon.png" alt="">
      <span class="name">Switchboard</span>
    </div>
    <h1>Every Claude Code session, every account, <span class="hl">one window</span></h1>
    <div class="facts">
      <span class="pill"><i style="background:var(--accent)"></i>Personal</span>
      <span class="pill"><i style="background:var(--link)"></i>Work</span>
      <span class="pill">macOS and Windows</span>
      <span class="pill">Free and open source</span>
    </div>
  </div>

  <div class="cta">
    <span class="brew mono"><span>$</span>brew install --cask estruyf/tap/switchboard</span>
  </div>

  <div class="shot"><img src="../../docs/screenshots/session-dark.png" alt=""></div>
</body>
</html>
